<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="24" fill="url(#bgGrad2)"/>

  <!-- School Desk / Table surface -->
  <path d="M0,320 L800,320 L800,480 L0,480 Z" fill="#FDE68A" opacity="0.4"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#F59E0B" stroke-width="3" opacity="0.6"/>

  <!-- Decorative floating stationery icons -->
  <circle cx="80" cy="85" r="18" fill="#FDE047" opacity="0.6"/>
  <circle cx="720" cy="95" r="22" fill="#93C5FD" opacity="0.5"/>
  <polygon points="730,160 735,172 748,172 737,180 741,192 730,184 719,192 723,180 712,172 725,172" fill="#FBBF24" opacity="0.7"/>
  <polygon points="70,180 74,190 85,190 76,196 79,206 70,200 61,206 64,196 55,190 66,190" fill="#F472B6" opacity="0.7"/>

  <!-- Title Pill -->
  <g filter="url(#badgeShadow)">
    <rect x="230" y="20" width="340" height="46" rx="23" fill="url(#headerGrad2)"/>
    <text x="400" y="50" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="1">MƏKTƏB BAZARLIĞI 🎒✏️</text>
  </g>

  <!-- ==================== 1. MƏKTƏB ÇANTASI (x = 80..260) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Backstraps -->
    <path d="M125,135 Q170,80 215,135" stroke="#991B1B" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M140,135 Q170,95 200,135" stroke="#EF4444" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Top Handle -->
    <path d="M150,110 Q170,85 190,110" stroke="#7F1D1D" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Main Backpack Body -->
    <rect x="110" y="125" width="120" height="175" rx="24" fill="#EF4444"/>
    <!-- Bottom reinforced base -->
    <path d="M110,270 L230,270 L230,280 C230,292 220,300 206,300 L134,300 C120,300 110,292 110,280 Z" fill="#B91C1C"/>
    
    <!-- Front Pocket -->
    <rect x="125" y="195" width="90" height="75" rx="14" fill="#FBBF24"/>
    <!-- Pocket Zipper -->
    <line x1="135" y1="210" x2="205" y2="210" stroke="#D97706" stroke-width="3" stroke-dasharray="4,3"/>
    <circle cx="170" cy="210" r="4.5" fill="#78350F"/>
    <!-- Cute Star Emblem on Pocket -->
    <polygon points="170,230 173,238 181,238 175,243 177,251 170,246 163,251 165,243 159,238 167,238" fill="#EF4444"/>

    <!-- Side Net Pockets with Water Bottle -->
    <rect x="98" y="185" width="14" height="60" rx="6" fill="#3B82F6"/>
    <rect x="100" y="170" width="10" height="18" rx="3" fill="#60A5FA"/>
    <rect x="228" y="185" width="14" height="60" rx="6" fill="#991B1B"/>

    <!-- Label Pill -->
    <g filter="url(#badgeShadow)">
      <rect x="105" y="345" width="130" height="34" rx="17" fill="#EF4444"/>
      <text x="170" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Məktəb Çantası</text>
    </g>
  </g>

  <!-- ==================== 2. DƏFTƏR VƏ KİTAB (x = 300..500) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Textbook (Behind) -->
    <g transform="translate(320, 115) rotate(-6)">
      <rect x="0" y="0" width="125" height="175" rx="10" fill="#3B82F6"/>
      <rect x="10" y="0" width="115" height="175" rx="6" fill="#2563EB"/>
      <rect x="25" y="25" width="85" height="50" rx="6" fill="#FFFFFF"/>
      <text x="67" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1D4ED8">ANA DİLİ</text>
      <circle cx="67" cy="115" r="28" fill="#FDE047"/>
      <polygon points="67,98 71,108 81,108 73,114 76,124 67,118 58,124 61,114 53,108 63,108" fill="#EA580C"/>
    </g>

    <!-- Open Notebook (In Front) -->
    <g transform="translate(345, 155)">
      <!-- Left Page -->
      <path d="M0,0 L70,5 L70,135 L0,130 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Right Page -->
      <path d="M70,5 L140,0 L140,130 L70,135 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Center Spiral -->
      <line x1="70" y1="5" x2="70" y2="135" stroke="#94A3B8" stroke-width="3"/>
      <!-- Lined paper stripes -->
      <line x1="10" y1="25" x2="60" y2="28" stroke="#93C5FD" stroke-width="2"/>
      <line x1="10" y1="45" x2="60" y2="48" stroke="#93C5FD" stroke-width="2"/>
      <line x1="10" y1="65" x2="60" y2="68" stroke="#93C5FD" stroke-width="2"/>
      <line x1="10" y1="85" x2="60" y2="88" stroke="#93C5FD" stroke-width="2"/>
      <line x1="10" y1="105" x2="50" y2="107" stroke="#93C5FD" stroke-width="2"/>

      <line x1="80" y1="28" x2="130" y2="25" stroke="#93C5FD" stroke-width="2"/>
      <line x1="80" y1="48" x2="130" y2="45" stroke="#93C5FD" stroke-width="2"/>
      <line x1="80" y1="68" x2="130" y2="65" stroke="#93C5FD" stroke-width="2"/>
      <line x1="80" y1="88" x2="130" y2="85" stroke="#93C5FD" stroke-width="2"/>
      <line x1="80" y1="108" x2="120" y2="105" stroke="#93C5FD" stroke-width="2"/>
      <!-- Cute Red Pen lying on notebook -->
      <g transform="translate(100, 30) rotate(25)">
        <rect x="0" y="0" width="10" height="90" rx="3" fill="#DC2626"/>
        <polygon points="0,90 5,106 10,90" fill="#FBBF24"/>
        <polygon points="3,101 5,106 7,101" fill="#0F172A"/>
        <rect x="0" y="10" width="10" height="8" fill="#FDE047"/>
      </g>
    </g>

    <!-- Label Pill -->
    <g filter="url(#badgeShadow)">
      <rect x="335" y="345" width="130" height="34" rx="17" fill="#2563EB"/>
      <text x="400" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Kitab və Dəftər</text>
    </g>
  </g>

  <!-- ==================== 3. QƏLƏMDAN VƏ LƏVAZİMATLAR (x = 550..750) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Ruler -->
    <g transform="translate(565, 140) rotate(15)">
      <rect x="0" y="0" width="28" height="150" rx="4" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
      <!-- Ticks -->
      <line x1="0" y1="20" x2="10" y2="20" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="40" x2="16" y2="40" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="60" x2="10" y2="60" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="80" x2="16" y2="80" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="100" x2="10" y2="100" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="120" x2="16" y2="120" stroke="#78350F" stroke-width="2"/>
    </g>

    <!-- Pencil Cup / Case -->
    <g transform="translate(620, 150)">
      <!-- Pencils sticking out -->
      <!-- Green Pencil -->
      <g transform="translate(15, -45) rotate(-10)">
        <rect x="0" y="0" width="12" height="95" fill="#10B981"/>
        <polygon points="0,0 6,-18 12,0" fill="#FDE68A"/>
        <polygon points="4,-12 6,-18 8,-12" fill="#047857"/>
      </g>
      <!-- Purple Pencil -->
      <g transform="translate(38, -50)">
        <rect x="0" y="0" width="12" height="100" fill="#8B5CF6"/>
        <polygon points="0,0 6,-18 12,0" fill="#FDE68A"/>
        <polygon points="4,-12 6,-18 8,-12" fill="#5B21B6"/>
      </g>
      <!-- Pink Pencil -->
      <g transform="translate(60, -42) rotate(12)">
        <rect x="0" y="0" width="12" height="92" fill="#EC4899"/>
        <polygon points="0,0 6,-18 12,0" fill="#FDE68A"/>
        <polygon points="4,-12 6,-18 8,-12" fill="#9D174D"/>
      </g>

      <!-- Cup itself -->
      <path d="M5,40 L15,140 L75,140 L85,40 Z" fill="#06B6D4" stroke="#0891B2" stroke-width="2"/>
      <ellipse cx="45" cy="40" rx="40" ry="10" fill="#22D3EE"/>
      <ellipse cx="45" cy="40" rx="34" ry="7" fill="#0E7490"/>
      <!-- Smiling Face on cup -->
      <circle cx="35" cy="85" r="3.5" fill="#FFFFFF"/>
      <circle cx="55" cy="85" r="3.5" fill="#FFFFFF"/>
      <path d="M37,100 Q45,110 53,100" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Eraser (Pozan) -->
    <g transform="translate(560, 270) rotate(-10)">
      <rect x="0" y="0" width="45" height="24" rx="4" fill="#3B82F6"/>
      <rect x="22" y="0" width="23" height="24" rx="4" fill="#F43F5E"/>
      <rect x="18" y="0" width="8" height="24" fill="#E2E8F0"/>
    </g>

    <!-- Label Pill -->
    <g filter="url(#badgeShadow)">
      <rect x="565" y="345" width="130" height="34" rx="17" fill="#059669"/>
      <text x="630" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Yazı Ləvazimatı</text>
    </g>
  </g>

  <!-- ==================== BOTTOM BANNER ==================== -->
  <g filter="url(#softShadow)">
    <rect x="140" y="415" width="520" height="46" rx="23" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="400" y="444" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#334155">
      📚 Dəftər və qələm şagirdin ən yaxın dostudur ✏️
    </text>
  </g>
</svg>