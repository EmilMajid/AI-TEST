    <rect x="609" y="320" width="16" height="9" rx="3" fill="#D97706"/>
    <rect x="627" y="320" width="16" height="9" rx="3" fill="#D97706"/>
    <!-- Dress -->
    <path d="M608,212 L644,212 L656,282 L596,282 Z" fill="#FBBF24"/>
    <!-- Polka dots -->
    <circle cx="616" cy="240" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="636" cy="240" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="626" cy="262" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <!-- Neck -->
    <rect x="620" y="198" width="12" height="15" rx="3" fill="#FCD34D"/>
    <!-- Head -->
    <circle cx="626" cy="175" r="22" fill="#FCD34D"/>
    <!-- Hair with Pigtails -->
    <circle cx="598" cy="168" r="9" fill="#B45309"/>
    <circle cx="654" cy="168" r="9" fill="#B45309"/>
    <circle cx="602" cy="170" r="4" fill="#EC4899"/>
    <circle cx="650" cy="170" r="4" fill="#EC4899"/>
    <path d="M604,175 C604,152 648,152 648,175 C644,163 638,160 626,160 C614,160 608,163 604,175 Z" fill="#B45309"/>
    <!-- Eyes -->
    <circle cx="619" cy="174" r="2.8" fill="#1E293B"/>
    <circle cx="633" cy="174" r="2.8" fill="#1E293B"/>
    <!-- Smile -->
    <path d="M620,183 Q626,189 632,183" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="614" cy="179" r="3.5" fill="#FDA4AF" opacity="0.7"/>
    <circle cx="638" cy="179" r="3.5" fill="#FDA4AF" opacity="0.7"/>
    <!-- Little Teddy Bear in arms -->
    <ellipse cx="642" cy="235" rx="10" ry="12" fill="#78350F"/>
    <circle cx="642" cy="222" r="8" fill="#78350F"/>
    <circle cx="637" cy="216" r="3" fill="#92400E"/>
    <circle cx="647" cy="216" r="3" fill="#92400E"/>

    <!-- Bacı Label Pill -->
    <g filter="url(#badgeShadow)">
      <rect x="581" y="350" width="90" height="34" rx="17" fill="#D97706"/>
      <text x="626" y="373" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Bacı</text>
    </g>
  </g>

  <!-- ==================== BOTTOM BANNER ==================== -->
  <g filter="url(#softShadow)">
    <rect x="140" y="415" width="520" height="46" rx="23" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="400" y="444" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#334155">
      ❤️ Mehriban ailə bizim ən böyük sərvətimizdir ❤️
    </text>
  </g>
</svg>