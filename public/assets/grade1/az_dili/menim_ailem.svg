<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="24" fill="url(#skyGrad)"/>

  <!-- Sun & Clouds -->
  <circle cx="710" cy="80" r="42" fill="#FDE047" opacity="0.85"/>
  <circle cx="710" cy="80" r="50" fill="#FEF08A" opacity="0.4"/>
  <path d="M60,95 Q75,70 105,75 Q125,55 155,70 Q180,65 195,85 Q205,105 185,115 L75,115 Q55,110 60,95 Z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M630,130 Q645,115 665,120 Q680,105 705,115 Q720,110 730,125 Q740,140 725,150 L645,150 Q625,145 630,130 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- Top Title Pill -->
  <g filter="url(#badgeShadow)">
    <rect x="250" y="20" width="300" height="46" rx="23" fill="url(#headerGrad)"/>
    <text x="400" y="50" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="1">MƏNİM AİLƏM 👨‍👩‍👧‍👦</text>
  </g>

  <!-- Ground Hills -->
  <ellipse cx="400" cy="480" rx="460" ry="110" fill="#86EFAC" opacity="0.6"/>
  <ellipse cx="400" cy="495" rx="440" ry="90" fill="#4ADE80" opacity="0.5"/>

  <!-- ==================== 1. ATA (x = 130) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Body & Clothes -->
    <!-- Legs -->
    <rect x="150" y="240" width="18" height="85" rx="7" fill="#1E3A8A"/>
    <rect x="174" y="240" width="18" height="85" rx="7" fill="#1E3A8A"/>
    <!-- Shoes -->
    <rect x="145" y="320" width="26" height="12" rx="5" fill="#0F172A"/>
    <rect x="173" y="320" width="26" height="12" rx="5" fill="#0F172A"/>
    <!-- Shirt / Torso -->
    <rect x="140" y="160" width="62" height="88" rx="14" fill="#2563EB"/>
    <!-- Collar -->
    <polygon points="163,160 171,178 179,160" fill="#FFFFFF"/>
    <!-- Neck -->
    <rect x="164" y="146" width="14" height="16" rx="4" fill="#FCD34D"/>
    <!-- Head -->
    <circle cx="171" cy="120" r="30" fill="#FCD34D"/>
    <!-- Hair -->
    <path d="M142,120 C142,88 200,88 200,120 C194,102 184,100 171,100 C158,100 148,104 142,120 Z" fill="#334155"/>
    <!-- Eyes -->
    <circle cx="162" cy="118" r="3.5" fill="#1E293B"/>
    <circle cx="180" cy="118" r="3.5" fill="#1E293B"/>
    <circle cx="163.5" cy="116.5" r="1.2" fill="#FFFFFF"/>
    <circle cx="181.5" cy="116.5" r="1.2" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M162,130 Q171,138 180,130" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="155" cy="125" r="4" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="187" cy="125" r="4" fill="#FCA5A5" opacity="0.6"/>

    <!-- Ata Label Pill -->
    <g filter="url(#badgeShadow)">
      <rect x="126" y="350" width="90" height="34" rx="17" fill="#1E3A8A"/>
      <text x="171" y="373" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Ata</text>
    </g>
  </g>

  <!-- ==================== 2. ANA (x = 310) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Legs -->
    <rect x="300" y="275" width="14" height="50" rx="6" fill="#FCD34D"/>
    <rect x="320" y="275" width="14" height="50" rx="6" fill="#FCD34D"/>
    <!-- Shoes -->
    <rect x="296" y="320" width="20" height="10" rx="4" fill="#BE185D"/>
    <rect x="318" y="320" width="20" height="10" rx="4" fill="#BE185D"/>
    <!-- Dress -->
    <path d="M295,168 L339,168 L355,278 L279,278 Z" fill="#EC4899"/>
