    <g filter="url(#badgeShadow)">
      <rect x="272" y="350" width="90" height="34" rx="17" fill="#BE185D"/>
      <text x="317" y="373" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Ana</text>
    </g>
  </g>

  <!-- ==================== 3. QARDAŞ / OĞUL (x = 475) ==================== -->
