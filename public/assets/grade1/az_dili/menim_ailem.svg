    <rect x="291" y="208" width="52" height="8" rx="4" fill="#BE185D"/>
    <!-- Neck -->
    <rect x="310" y="148" width="14" height="18" rx="4" fill="#FCD34D"/>
    <!-- Head -->
    <circle cx="317" cy="124" r="28" fill="#FCD34D"/>
    <!-- Long Hair -->
    <path d="M288,135 C284,86 350,86 346,135 C350,170 348,185 338,190 C336,160 342,122 317,112 C292,122 298,160 296,190 C286,185 284,170 288,135 Z" fill="#92400E"/>
    <!-- Hair Flowers -->
    <circle cx="292" cy="115" r="6" fill="#F43F5E"/>
    <circle cx="292" cy="115" r="2.5" fill="#FEF08A"/>
    <!-- Eyes -->
    <circle cx="309" cy="122" r="3.2" fill="#1E293B"/>
    <circle cx="325" cy="122" r="3.2" fill="#1E293B"/>
    <circle cx="310" cy="120.5" r="1.2" fill="#FFFFFF"/>
    <circle cx="326" cy="120.5" r="1.2" fill="#FFFFFF"/>
    <!-- Eyelashes -->
    <path d="M305,117 L308,119 M329,117 L326,119" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M310,134 Q317,142 324,134" stroke="#BE185D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="302" cy="129" r="4.5" fill="#FDA4AF" opacity="0.7"/>
    <circle cx="332" cy="129" r="4.5" fill="#FDA4AF" opacity="0.7"/>

