    <g filter="url(#badgeShadow)">
      <rect x="431" y="350" width="90" height="34" rx="17" fill="#047857"/>
      <text x="476" y="373" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Qardaş</text>
    </g>
  </g>

  <!-- ==================== 4. BALACA BACI (x = 620) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Legs -->
    <rect x="612" y="275" width="11" height="50" rx="4" fill="#FCD34D"/>
    <rect x="629" y="275" width="11" height="50" rx="4" fill="#FCD34D"/>
