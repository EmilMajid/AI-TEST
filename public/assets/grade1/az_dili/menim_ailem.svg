    <!-- Neck -->
    <rect x="470" y="180" width="12" height="16" rx="4" fill="#FCD34D"/>
    <!-- Head -->
    <circle cx="476" cy="155" r="25" fill="#FCD34D"/>
    <!-- Short Brown Hair -->
    <path d="M451,155 C451,128 501,128 501,155 C496,140 488,138 476,138 C464,138 456,140 451,155 Z" fill="#78350F"/>
    <!-- Cap -->
    <path d="M453,142 C453,130 499,130 499,142 Z" fill="#F59E0B"/>
    <path d="M485,142 L510,145 L485,147 Z" fill="#D97706"/>
    <!-- Eyes -->
    <circle cx="468" cy="154" r="3" fill="#1E293B"/>
    <circle cx="484" cy="154" r="3" fill="#1E293B"/>
    <!-- Smile -->
    <path d="M469,165 Q476,172 483,165" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
