    $(document).ready(function(){

        //progressloadonbefore();
        if(typeof(Storage) !== "undefined") {

            if(localStorage.getItem("fenn795_ses_pagepath") != null && localStorage.getItem("fenn795_ses_pagepath") != ''){

                var str = location.hash;
                var arr = str.split('#');
                var file_path = arr[arr.length-1];
                if(localStorage.getItem("fenn795_ses_pagepath") == file_path){
                    history.pushState("", document.title, window.location.pathname);
                    location.reload();
                    //setHash(localStorage.getItem("fenn795_ses_pagepath"));
                }else{
                    setHash(localStorage.getItem("fenn795_ses_pagepath"));
                }
            }else{
                setHash("units/unit-1/page1.xhtml");
            }
        } else {
            alert("Browser local yaddaş saxlanılmasına icaze vermir.");
        }
    });
</script>
